# Contrôles automatiques à chaque envoi : base de données, appli, service d'envoi
name: Tests
on:
  push:
  pull_request:

jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 + horloge figée
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 faketime
      - name: Migrations + scénarios SQL
        run: |
          sudo bash supabase/tests/run.sh | tee resultat.txt
          grep -q "| *0$" <(grep -A2 "reussis" resultat.txt | tail -1) || { echo "Des tests SQL échouent"; exit 1; }

  appli:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  envoi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.5.6 }
      - run: node supabase/functions/envoyer-notifications/integration.test.mjs supabase/functions/envoyer-notifications/index.ts
      - run: node supabase/functions/envoyer-notifications/integration.test.mjs supabase/functions/envoyer-notifications/index.ts email

  parcours:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Démo locale + parcours de bout en bout (rôles, accessibilité, superposition)
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          npm run e2e

  parcours-reel:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Appli réelle sur base locale (7 comptes, pointer, demander, valider, fiches, accès)
        run: npm run e2e:reel

  pwa:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build de production + PWA (installable, préchargement, hors ligne, mise à jour)
        run: |
          npm run build
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run e2e:pwa
